# Sync Streams de PowerSync (edition 3) - CLAUDE.md seccion 2.2 y 3.4:
# cada usuario solo sincroniza sus propias notas.
#
# auth.user_id() se resuelve a partir del claim `sub` del powersyncToken
# (JWT emitido por nuestro backend en /auth/login y /auth/token).
#
# Nota: el dashboard de PowerSync Cloud usa el formato "Sync Streams"
# (mas nuevo que el clasico bucket_definitions); este archivo sigue ese
# formato para que se pueda pegar directo en el editor del dashboard.

config:
  edition: 3

streams:
  notas:
    auto_subscribe: true
    query: SELECT id, user_id, titulo, contenido, updated_at, deleted FROM notas WHERE notas.user_id = auth.user_id()
