# trustStoreType=Windows-ROOT: en esta red HTTPS pasa por un proxy que
# firma con un certificado que Windows confia pero el truststore propio
# de la JVM no trae; delegar en el almacen de Windows evita fallos SSL
# al descargar dependencias.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=Windows-ROOT
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# El JBR que trae Android Studio no incluye el proveedor SunMSCAPI, asi
# que "Windows-ROOT" (necesario por el proxy TLS de esta red) no
# funciona ahi. Usamos el JDK del sistema para el daemon de Gradle.
